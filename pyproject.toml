[project]
name = "seguro-viagem-poc"
version = "0.1.0"
description = "Sistema de agentes para subscrição, tarifação e liquidação de um seguro paramétrico de viagem."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-openrouter>=0.2",
    "langchain-litellm>=0.6",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "markitdown>=0.1",
    "pypdfium2>=4.0",
    "reportlab>=4.0",
    "ddgs>=9.0",
    "streamlit>=1.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

# The project runs as a system, not as an installable package.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
